# Config trees that live in their own repositories. `mise bootstrap` clones a
# missing one and only fast-forwards an existing clone when its worktree is
# clean and its origin matches. ~/.config/zsh is the real ZDOTDIR that
# home/.zshenv points at; without it a fresh machine gets a bare shell.
[bootstrap.repos]
"~/.config/zsh"  = { url = "git@github.com:andrewmcodes/zdotdir.git" }
"~/.config/nvim" = { url = "git@github.com:andrewmcodes/dotfiles-nvim.git" }

# Values copied from the primary Mac. tilesize and KeyRepeat are floats there,
# and a TOML float keeps them `real` rather than rewriting them as integers.
[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
magnification = false
mru-spaces = false
orientation = "right"
show-recents = true
tilesize = 42.0

[bootstrap.macos.defaults."com.apple.finder"]
AppleShowAllFiles = true
FXDefaultSearchScope = "SCcf"
FXPreferredViewStyle = "Nlsv"
ShowPathbar = true
ShowStatusBar = true
_FXShowPosixPathInTitle = false

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
ApplePressAndHoldEnabled = false
InitialKeyRepeat = 15
KeyRepeat = 2.0

[bootstrap.hooks.post-defaults]
run = "killall Dock Finder || true"

# Dotfiles, all in copy mode so restored files are real files, never symlinks.
#
# Rules enforced by scripts/verify-dotfiles.sh and tests/dotfiles.bats:
#   - every entry states mode = "copy" explicitly; never rely on default_mode,
#     because an entry mise writes itself omits mode and falls back to symlink
#   - no symlink or symlink-each entry, ever
#   - no directory entry on ~/.config, ~/.config/mise, or ~/.claude: those trees
#     hold untracked local files (config.local.toml carries a token,
#     settings.local.json is gitignored) that must not reach a public repo
#   - directory entries are used only where the live tree contains exactly the
#     files in config/chezmoi-baseline.txt, so a backup cannot silently widen
#     scope. ~/.warp/themes and ~/bin are listed per-file for that reason:
#     both hold live files this repository deliberately does not manage.
[dotfiles]
"~/.claude/hooks/herdr-agent-state.sh"   = { source = "home/.claude/hooks/herdr-agent-state.sh", mode = "copy" }
"~/.claude/settings.json"                = { source = "home/.claude/settings.json", mode = "copy" }
"~/.config/act/actrc"                    = { source = "home/.config/act/actrc", mode = "copy" }
"~/.config/asciinema/install-id"         = { source = "home/.config/asciinema/install-id", mode = "copy" }
"~/.config/atuin/config.toml"            = { source = "home/.config/atuin/config.toml", mode = "copy" }
"~/.config/bundle/config"                = { source = "home/.config/bundle/config", mode = "copy" }
"~/.config/direnv/direnvrc"              = { source = "home/.config/direnv/direnvrc", mode = "copy" }
"~/.config/direnv/lib/use_mise.sh"       = { source = "home/.config/direnv/lib/use_mise.sh", mode = "copy" }
"~/.config/duti/default.duti"            = { source = "home/.config/duti/default.duti", mode = "copy" }
"~/.config/gh-dash/config.yml"           = { source = "home/.config/gh-dash/config.yml", mode = "copy" }
"~/.config/gh/config.yml"                = { source = "home/.config/gh/config.yml", mode = "copy" }
"~/.config/git/config"                   = { source = "home/.config/git/config", mode = "copy" }
