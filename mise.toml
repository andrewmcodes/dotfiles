# mise.toml - Dotfile management, machine bootstrap, and repository tasks.
#
# Setup on a new machine: git clone, then `mise trust && mise bootstrap`.
# Day-to-day dotfile capture: `mise run dotfiles:backup`.

# Reverse capture (`mise bootstrap dotfiles add <target> --no-apply`) does not
# behave correctly on 2026.7.15, which is what homebrew-core shipped at the time
# of writing: the backup workflow depends on it, so fail loudly rather than
# silently mis-capturing. 2026.8.8 is the oldest version verified to work.
min_version = "2026.8.8"

[settings]
dotfiles.default_mode = "copy"

# Seed location for `mise bootstrap dotfiles add` on a target that is not yet
# configured. This value is resolved against the PROCESS WORKING DIRECTORY, not
# against this file, and mise's default is "~/.dotfiles" -- which would create a
# directory in $HOME. Every script in scripts/ therefore cds to the repository
# root before invoking mise, and asserts the resolved root stays inside the repo.
dotfiles.root = "home"

# Homebrew formulae, casks, and Mac App Store apps installed on request on the
