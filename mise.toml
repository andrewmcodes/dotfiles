# mise.toml - Dotfile management, machine bootstrap, and repository tasks.
#
# Setup on a new machine: git clone, then `mise trust && mise bootstrap`.
# Day-to-day dotfile capture: `mise run dotfiles:backup`.

# Reverse capture (`mise bootstrap dotfiles add <target> --no-apply`) does not
# behave correctly on 2026.7.15, which is what homebrew-core shipped at the time
# of writing: the backup workflow depends on it, so fail loudly rather than
# silently mis-capturing. 2026.8.8 is the oldest version verified to work.
min_version = "2026.8.8"

[settings]
dotfiles.default_mode = "copy"

# Seed location for `mise bootstrap dotfiles add` on a target that is not yet
# configured. This value is resolved against the PROCESS WORKING DIRECTORY, not
# against this file, and mise's default is "~/.dotfiles" -- which would create a
# directory in $HOME. Every script in scripts/ therefore cds to the repository
# root before invoking mise, and asserts the resolved root stays inside the repo.
dotfiles.root = "home"

# Homebrew formulae and casks, migrated from the former Brewfile.
# `mise` itself is omitted: it is the tool running this bootstrap.
# `chezmoi` is omitted: this repository no longer uses it.
[bootstrap.packages]
"brew:bat" = "latest"
"brew:bats-core" = "latest"
"brew:coreutils" = "latest"
"brew:curl" = "latest"
"brew:diff-so-fancy" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:findutils" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:gnu-sed" = "latest"
"brew:grep" = "latest"
"brew:jq" = "latest"
"brew:reattach-to-user-namespace" = "latest"
"brew:ripgrep" = "latest"
"brew:shellcheck" = "latest"
"brew:starship" = "latest"
"brew:tailspin" = "latest"
"brew:tealdeer" = "latest"
"brew:tmux" = "latest"
"brew:wget" = "latest"
"brew:yq" = "latest"
"brew:zsh" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:visual-studio-code@insiders" = "latest"
"brew-cask:warp" = "latest"

# Config trees that live in their own repositories. `mise bootstrap` clones a
# missing one and only fast-forwards an existing clone when its worktree is
# clean and its origin matches. ~/.config/zsh is the real ZDOTDIR that
# home/.zshenv points at; without it a fresh machine gets a bare shell.
[bootstrap.repos]
"~/.config/zsh"  = { url = "git@github.com:andrewmcodes/zdotdir.git" }
"~/.config/nvim" = { url = "git@github.com:andrewmcodes/dotfiles-nvim.git" }

# Dotfiles, all in copy mode so restored files are real files, never symlinks.
#
# Rules enforced by scripts/verify-dotfiles.sh and tests/dotfiles.bats:
#   - every entry states mode = "copy" explicitly; never rely on default_mode,
#     because an entry mise writes itself omits mode and falls back to symlink
#   - no symlink or symlink-each entry, ever
#   - no directory entry on ~/.config, ~/.config/mise, or ~/.claude: those trees
#     hold untracked local files (config.local.toml carries a token,
#     settings.local.json is gitignored) that must not reach a public repo
#   - directory entries are used only where the live tree contains exactly the
#     files in config/chezmoi-baseline.txt, so a backup cannot silently widen
#     scope. ~/.warp/themes and ~/bin are listed per-file for that reason:
#     both hold live files this repository deliberately does not manage.
[dotfiles]
"~/.claude/hooks/herdr-agent-state.sh"   = { source = "home/.claude/hooks/herdr-agent-state.sh", mode = "copy" }
"~/.claude/settings.json"                = { source = "home/.claude/settings.json", mode = "copy" }
"~/.config/act/actrc"                    = { source = "home/.config/act/actrc", mode = "copy" }
"~/.config/asciinema/install-id"         = { source = "home/.config/asciinema/install-id", mode = "copy" }
"~/.config/atuin/config.toml"            = { source = "home/.config/atuin/config.toml", mode = "copy" }
"~/.config/bundle/config"                = { source = "home/.config/bundle/config", mode = "copy" }
"~/.config/direnv/direnvrc"              = { source = "home/.config/direnv/direnvrc", mode = "copy" }
"~/.config/direnv/lib/use_mise.sh"       = { source = "home/.config/direnv/lib/use_mise.sh", mode = "copy" }
"~/.config/duti/default.duti"            = { source = "home/.config/duti/default.duti", mode = "copy" }
"~/.config/gh-dash/config.yml"           = { source = "home/.config/gh-dash/config.yml", mode = "copy" }
"~/.config/gh/config.yml"                = { source = "home/.config/gh/config.yml", mode = "copy" }
"~/.config/git/config"                   = { source = "home/.config/git/config", mode = "copy" }
"~/.config/git/ignore"                   = { source = "home/.config/git/ignore", mode = "copy" }
"~/.config/glow/glow.yml"                = { source = "home/.config/glow/glow.yml", mode = "copy" }
"~/.config/herdr/config.toml"            = { source = "home/.config/herdr/config.toml", mode = "copy" }
"~/.config/kitty/kitty.conf"             = { source = "home/.config/kitty/kitty.conf", mode = "copy" }
"~/.config/lazygit/config.yml"           = { source = "home/.config/lazygit/config.yml", mode = "copy" }
"~/.config/mise/config.toml"             = { source = "home/.config/mise/config.toml", mode = "copy" }
"~/.config/mise/tasks"                   = { source = "home/.config/mise/tasks", mode = "copy" }
"~/.config/pry/pryrc"                    = { source = "home/.config/pry/pryrc", mode = "copy" }
"~/.config/starship.toml"                = { source = "home/.config/starship.toml", mode = "copy" }
"~/.config/tailspin/config.toml"         = { source = "home/.config/tailspin/config.toml", mode = "copy" }
"~/.config/tape/config.yaml"             = { source = "home/.config/tape/config.yaml", mode = "copy" }
"~/.config/tealdeer/config.toml"         = { source = "home/.config/tealdeer/config.toml", mode = "copy" }
"~/.config/tmux/tmux.conf"               = { source = "home/.config/tmux/tmux.conf", mode = "copy" }
"~/.config/zed/settings.json"            = { source = "home/.config/zed/settings.json", mode = "copy" }
"~/.default-gems"                        = { source = "home/.default-gems", mode = "copy" }
"~/.default-npm-packages"                = { source = "home/.default-npm-packages", mode = "copy" }
"~/.editorconfig"                        = { source = "home/.editorconfig", mode = "copy" }
"~/.fzf.zsh"                             = { source = "home/.fzf.zsh", mode = "copy" }
"~/.gemrc"                               = { source = "home/.gemrc", mode = "copy" }
"~/.mackup.cfg"                          = { source = "home/.mackup.cfg", mode = "copy" }
"~/.prettierrc"                          = { source = "home/.prettierrc", mode = "copy" }
"~/.searchlink"                          = { source = "home/.searchlink", mode = "copy" }
"~/.warp/keybindings.yaml"               = { source = "home/.warp/keybindings.yaml", mode = "copy" }
"~/.warp/launch_configurations"          = { source = "home/.warp/launch_configurations", mode = "copy" }
"~/.warp/themes/One_Dark_Darker.yaml"    = { source = "home/.warp/themes/One_Dark_Darker.yaml", mode = "copy" }
"~/.warp/themes/Radix.yaml"              = { source = "home/.warp/themes/Radix.yaml", mode = "copy" }
"~/.warp/themes/andrewmcodes_slate.yaml" = { source = "home/.warp/themes/andrewmcodes_slate.yaml", mode = "copy" }
"~/.warp/themes/blue-dark-waves.jpg"     = { source = "home/.warp/themes/blue-dark-waves.jpg", mode = "copy" }
"~/.warp/themes/blue-dark-waves.yaml"    = { source = "home/.warp/themes/blue-dark-waves.yaml", mode = "copy" }
"~/.warp/themes/foo.md"                  = { source = "home/.warp/themes/foo.md", mode = "copy" }
"~/.warp/themes/nightshade.yaml"         = { source = "home/.warp/themes/nightshade.yaml", mode = "copy" }
"~/.warp/themes/one_dark_darker_2.yaml"  = { source = "home/.warp/themes/one_dark_darker_2.yaml", mode = "copy" }
"~/.warp/themes/onedark.yaml"            = { source = "home/.warp/themes/onedark.yaml", mode = "copy" }
"~/.warp/themes/vibrancy_4.png"          = { source = "home/.warp/themes/vibrancy_4.png", mode = "copy" }
"~/.warp/themes/vibrancy_4.yaml"         = { source = "home/.warp/themes/vibrancy_4.yaml", mode = "copy" }
"~/.warp/themes/vibrancy_8.png"          = { source = "home/.warp/themes/vibrancy_8.png", mode = "copy" }
"~/.warp/themes/vibrancy_8.yaml"         = { source = "home/.warp/themes/vibrancy_8.yaml", mode = "copy" }
"~/.warp/themes/vs_code.yaml"            = { source = "home/.warp/themes/vs_code.yaml", mode = "copy" }
"~/.warp/workflows"                      = { source = "home/.warp/workflows", mode = "copy" }  # dir, 5 files
"~/.zshenv"                              = { source = "home/.zshenv", mode = "copy" }
"~/bin/defaults_diff"                    = { source = "home/bin/defaults_diff", mode = "copy" }
"~/bin/fzf_prs"                          = { source = "home/bin/fzf_prs", mode = "copy" }

[tasks."dotfiles:verify"]
description = "Verify the committed backup covers and matches the live dotfiles"
run = "./scripts/verify-dotfiles.sh"

[tasks."dotfiles:backup"]
description = "Capture live dotfiles from $HOME into the repository"
run = "./scripts/backup-dotfiles.sh"

[tasks."dotfiles:restore"]
description = "Preview restoring dotfiles from the repository into $HOME"
run = "./scripts/restore-dotfiles.sh"

[tasks."dotfiles:modes"]
description = "Reapply recorded file modes from the manifest"
run = "./scripts/apply-dotfile-modes.sh"

[tasks."dotfiles:fingerprint"]
description = "Print a read-only fingerprint of every managed live dotfile"
run = "./scripts/fingerprint-home.sh -"

[tasks.lint]
description = "Run shellcheck on all shell scripts"
run = """
echo "Running shellcheck..."
shellcheck scripts/*.sh
shellcheck scripts/lib/*.sh
"""

[tasks.test]
description = "Run the test suite"
run = "bats tests/dotfiles.bats tests/config.bats"

[tasks.ci]
description = "Simulate CI checks locally"
depends = ["lint", "test"]

[tasks.docs]
description = "Open documentation"
run = """
echo "Opening documentation..."
open README.md 2>/dev/null || cat README.md
"""

[tasks.clean]
description = "Clean up temporary files and coverage reports"
run = """
echo "Cleaning up..."
rm -rf coverage/
rm -rf tmp/
echo "Cleanup complete!"
"""
